name: Deploy

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Azure kaynak grubu adı
        required: true
        type: string
      deployment_name:
        description: Altyapı dağıtımı adı (deploy-infra.ps1 varsayılanı main)
        required: false
        default: main
        type: string
      run_migrations:
        description: Veritabanı migration'ı uygulansın
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: Derle ve paketle
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: API paketi
        shell: pwsh
        run: ./scripts/deploy/publish-api.ps1 -OutputDir "$env:RUNNER_TEMP/artifacts"

      - name: Web paketi
        shell: pwsh
        run: ./scripts/deploy/publish-web.ps1 -OutputDir "$env:RUNNER_TEMP/artifacts"

      - name: Migration paketi
        run: |
          dotnet tool install --global dotnet-ef --version "10.0.14"
          dotnet ef migrations bundle \
            --project backend/src/LGSApp.Infrastructure \
            --startup-project backend/src/LGSApp.Api \
            --configuration Release -r linux-x64 --self-contained --force \
            -o "${RUNNER_TEMP}/artifacts/efbundle"

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            ${{ runner.temp }}/artifacts/api.zip
            ${{ runner.temp }}/artifacts/web.zip
            ${{ runner.temp }}/artifacts/efbundle
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Production'a dağıt
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    env:
      RESOURCE_GROUP: ${{ inputs.resource_group }}
      DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Altyapı çıktılarını oku
        run: |
          outputs="$(az deployment group show --resource-group "${RESOURCE_GROUP}" --name "${DEPLOYMENT_NAME}" --query properties.outputs --output json)"
          {
            echo "API_APP=$(jq -r .apiAppName.value <<<"${outputs}")"
            echo "WEB_APP=$(jq -r .webAppName.value <<<"${outputs}")"
            echo "API_URL=$(jq -r .apiUrl.value <<<"${outputs}")"
            echo "WEB_URL=$(jq -r .webUrl.value <<<"${outputs}")"
            echo "VAULT=$(jq -r .keyVaultName.value <<<"${outputs}")"
            echo "SQL_SERVER=$(jq -r .sqlServerName.value <<<"${outputs}")"
          } >>"${GITHUB_ENV}"

      - name: Migration (geçici güvenlik duvarı kuralı)
        if: inputs.run_migrations
        run: |
          set -euo pipefail
          conn="$(az keyvault secret show --vault-name "${VAULT}" --name Sql-ConnectionString --query value --output tsv)"
          echo "::add-mask::${conn}"
          ip="$(curl -fsS --max-time 15 https://api.ipify.org | tr -d '[:space:]')"
          if ! [[ "${ip}" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "::error::Geçersiz IPv4 adresi alındı"
            exit 1
          fi
          rule="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            az sql server firewall-rule delete --resource-group "${RESOURCE_GROUP}" --server "${SQL_SERVER}" --name "${rule}" \
              || { echo "::error::Güvenlik duvarı kuralı silinemedi: ${rule}"; exit 1; }
          }
          trap cleanup EXIT
          az sql server firewall-rule create --resource-group "${RESOURCE_GROUP}" --server "${SQL_SERVER}" \
            --name "${rule}" --start-ip-address "${ip}" --end-ip-address "${ip}" --output none
          sleep 30
          chmod +x release/efbundle
          export ASPNETCORE_ENVIRONMENT=Production
          export ConnectionStrings__DefaultConnection="${conn}"
          cd "${RUNNER_TEMP}"
          "${GITHUB_WORKSPACE}/release/efbundle"

      - name: API dağıt
        run: |
          az webapp deploy --resource-group "${RESOURCE_GROUP}" --name "${API_APP}" --src-path release/api.zip --type zip

      - name: Web dağıt
        run: |
          az webapp deploy --resource-group "${RESOURCE_GROUP}" --name "${WEB_APP}" --src-path release/web.zip --type zip

      - name: Sağlık denetimi
        run: |
          check() {
            for attempt in $(seq 1 30); do
              if [ "$(curl -s -o /dev/null -w '%{http_code}' "$1")" = "200" ]; then
                echo "$1 hazır"
                return 0
              fi
              sleep 10
            done
            echo "::error::$1 5 dakika içinde 200 dönmedi"
            return 1
          }
          check "${API_URL}/health/ready"
          check "${WEB_URL}/healthz"
